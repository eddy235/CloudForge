# AWS-free CloudForge cloud deployment blueprint.
# Provisioning is OPTIONAL; committing this file alone does not deploy or charge.
# Render service name should be distinct from the existing NexusDesk demo.
services:
  - type: web
    name: cloudforge-demo
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/eddy235/CloudForge
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: NEXUSDESK_DEMO_MODE
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "false"
      - key: DJANGO_ENABLE_HSTS
        value: "true"
