# Local-only HTTP smoke environment. Not a cloud production configuration.
services:
  nexusdesk-demo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-cloudforge-demo-secret-change-for-real-deployments}
      NEXUSDESK_DEMO_MODE: "true"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_ENABLE_HSTS: "false"
