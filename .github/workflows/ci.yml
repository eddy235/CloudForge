name: CI - CloudForge v0.3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CloudForge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline security, source and release tests
        run: python -m unittest discover -s tests -v

  terraform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CloudForge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.12.2"
      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -diff -recursive
      - name: Initialize locally without a backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate infrastructure code (no AWS apply)
        run: terraform -chdir=infra/terraform validate -no-color

  container-demo:
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CloudForge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned NexusDesk v1.0 application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: eddy235/NexusDesk
          ref: 12a96a72418d13dd49f918584f7140a402aff0fa
          path: upstream/NexusDesk
          persist-credentials: false
      - name: Confirm pinned source
        run: |
          ACTUAL=$(git -C upstream/NexusDesk rev-parse HEAD)
          EXPECTED=$(sed -n 's/^COMMIT=//p' UPSTREAM_VERSION)
          test "$ACTUAL" = "$EXPECTED"
      - name: Build non-root Docker image
        run: docker build -t cloudforge-demo:test .
      - name: Start public fictional-data demo on loopback
        run: |
          docker run --detach --name cloudforge-ci \
            --read-only --tmpfs /tmp:size=16m,noexec,nosuid \
            --security-opt no-new-privileges --cap-drop ALL \
            -p 127.0.0.1:8000:8000 \
            -e DJANGO_SECRET_KEY=ci-demo-secret-long-enough-to-run-isolated-container \
            -e NEXUSDESK_DEMO_MODE=true -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e DJANGO_SECURE_SSL_REDIRECT=false \
            -e DJANGO_ENABLE_HSTS=false \
            cloudforge-demo:test
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8000/health/ >/dev/null; then break; fi
            sleep 2
          done
      - name: Exercise demo isolation and content security
        run: python scripts/smoke_local.py
      - name: Print container logs on failure
        if: failure()
        run: docker logs cloudforge-ci || true
      - name: Clean up local container
        if: always()
        run: docker rm --force cloudforge-ci || true

  render-container:
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CloudForge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build self-contained Render image from pinned NexusDesk commit
        run: docker build --file Dockerfile.render --tag cloudforge-render:test .
      - name: Record the tested source and local image identifiers
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/verifier-source.txt
          docker image inspect --format '{{.Id}}' cloudforge-render:test > reports/image-id.txt
          sha256sum Dockerfile.render UPSTREAM_VERSION > reports/source-checksums.txt
      - name: Scan the complete runtime image, including unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: cloudforge-render:test
          scanners: vuln
          format: json
          output: reports/trivy.json
          exit-code: '0'
          list-all-pkgs: 'true'
      - name: Generate a CycloneDX software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          image-ref: cloudforge-render:test
          format: cyclonedx
          output: reports/sbom.cdx.json
          exit-code: '0'
      - name: Block fixable HIGH and CRITICAL image vulnerabilities
        run: |
          trivy image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format table \
            cloudforge-render:test
      - name: Retain scan, SBOM and image evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-image-evidence-${{ github.sha }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Launch isolated fictional demo
        run: |
          docker run --detach --name cloudforge-render-ci \
            --read-only --tmpfs /tmp:size=16m,noexec,nosuid \
            --security-opt no-new-privileges --cap-drop ALL \
            -p 127.0.0.1:8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-render-demo-long-random-test-secret \
            -e NEXUSDESK_DEMO_MODE=true -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e DJANGO_SECURE_SSL_REDIRECT=false \
            -e DJANGO_ENABLE_HSTS=false \
            cloudforge-render:test
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8000/health/ >/dev/null; then break; fi
            sleep 2
          done
      - name: Verify demo is fictional and operational URLs stay inaccessible
        run: python scripts/smoke_local.py
      - name: Container logs if failed
        if: failure()
        run: docker logs cloudforge-render-ci || true
      - name: Clean up Render test image container
        if: always()
        run: docker rm --force cloudforge-render-ci || true
