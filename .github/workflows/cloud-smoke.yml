name: Verify cloud demo HTTPS (manual, no cloud credentials)

on:
  workflow_dispatch:
    inputs:
      service_origin:
        description: "HTTPS origin of the fictional Render or App Runner demo"
        default: "https://cloudforge-demo.onrender.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout CloudForge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify deployed HTTPS demo without cloud credentials
        env:
          SERVICE_ORIGIN: ${{ inputs.service_origin }}
        run: python scripts/smoke_cloud.py "$SERVICE_ORIGIN" --report reports/cloud-verification.json
      - name: Retain the operational check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-verification-${{ github.run_id }}
          path: reports/cloud-verification.json
          retention-days: 7
          if-no-files-found: error
